name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} attestation - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    # This check reads evidence bound to the head commit, so editing the pull
    # request text can neither satisfy nor invalidate it. `edited` is subscribed
    # for a reason that has nothing to do with the body: it is the activity type
    # GitHub fires when a pull request's base branch changes, so without it a
    # pull request retargeted onto main never runs this check at all and sits
    # waiting for a status that can no longer be reported.
    #
    # It is NOT how an unchanged head is re-evaluated after its attestation is
    # published. `bin/fm-attest.sh write` re-runs the run that judged that head,
    # which replays this same event against the same head.sha and re-derives the
    # verdict from the evidence now present. Editing a pull request to nudge a
    # check is the manual step that mechanism exists to remove; do not restore
    # it here or in what this check tells a contributor.
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  contents: read

# One group per head commit, so a check for one head can never replace or cancel
# the check for another. Re-running the same head coalesces as usual.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # The head commit itself, not the merge commit: the attestation names this
      # exact sha, and bin/fm-attest.sh must be the copy under review.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      # Git notes do not travel with refs/pull/*, so the attestation ref is read
      # from the repository the branch was pushed to. This step addresses the two
      # repositories that read needs and does not perform it: the verifier reads
      # them itself, once before its verdict and again for as long as it is
      # boundedly waiting for an attestation that has not arrived yet, and one
      # program doing all of that is what keeps the first read and the re-reads
      # from disagreeing about what an unreachable repository means.
      #
      # What stays here is what must not be decided by a pull request's own copy
      # of anything: which repositories are addressed, and how the job's token is
      # put into a URL. Only a remote name crosses into the verifier.
      - name: Address the repositories the attestation is read from
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$HEAD_REPO" in
            '' | */*/* | /* | */)
              echo "::error::The pull request head repository is unavailable, so its attestation cannot be read." >&2
              exit 1
              ;;
            *[!A-Za-z0-9._/-]* | *//*)
              echo "::error::The pull request head repository name is not a usable repository path." >&2
              exit 1
              ;;
            */*) ;;
            *)
              echo "::error::The pull request head repository is unavailable, so its attestation cannot be read." >&2
              exit 1
              ;;
          esac

          # The base repository is read through an explicit token URL. A fork is
          # read through its plain https URL, which still carries the job's token
          # because actions/checkout persists it in this workspace's git config,
          # so neither read is anonymous. Both are read-only and both go to the
          # host the token was issued for, and the token is written into this
          # workspace's git config, which is where actions/checkout has already
          # put it.
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            url="https://x-access-token:${GH_TOKEN}@github.com/${HEAD_REPO}.git"
          else
            url="https://github.com/${HEAD_REPO}.git"
          fi

          # The attestation is published to the head repository; refs/pull/*
          # lives in the base repository, which is why these are two remotes even
          # when they are one repository.
          git remote add attestation-source "$url" >/dev/null 2>&1 \
            || git remote set-url attestation-source "$url" >/dev/null 2>&1
          git remote add pullrequest-source \
            "https://x-access-token:${GH_TOKEN}@github.com/${BASE_REPO}.git" >/dev/null 2>&1 \
            || git remote set-url pullrequest-source \
              "https://x-access-token:${GH_TOKEN}@github.com/${BASE_REPO}.git" >/dev/null 2>&1

          # Every call above is made with its output suppressed, because a URL
          # embedding the job token is quoted back by git in its own errors and a
          # stream left attached writes that token into the job log. Actions
          # redacts it from logs, which makes this defence in depth rather than
          # the only thing between the token and the log.
          echo "Reading the attestation from ${HEAD_REPO} and the pull request head from ${BASE_REPO}."

      - name: Verify the head-bound no-mistakes attestation
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -eu
          # A genuinely pipeline-raised head is pushed before its attestation
          # exists, so this check's first look at one can be a near miss rather
          # than anything about the change. `reconcile` re-reads the ref for a
          # short bounded window while - and only while - no attestation for this
          # head has arrived, and then reaches its verdict through `verify`,
          # which is the only thing here that can reach one at all. The window is
          # for absence: evidence already seen to be invalid, unbound or
          # unreadable is refused on the first look, and a head nobody has
          # attested is still refused, at the end of the window.
          #
          # The verifier runs from the pull request's own head, so a head raised
          # before `reconcile` existed does not carry it. Such a head is verified
          # without a window, exactly as it was before, rather than being failed
          # for the age of its checkout. This fallback can go once no open pull
          # request predates the subcommand.
          verifier=verify
          if bin/fm-attest.sh --supports reconcile >/dev/null 2>&1; then
            verifier=reconcile
          fi
          # The verifier's two non-zero exits are two different statements and
          # this check must not collapse them, because collapsing evidence it
          # never examined into "no evidence" is the defect this whole check
          # exists to remove. Exit 1 is a refusal: the evidence was examined and
          # found absent, unbound or invalid, which is a verdict. Anything else
          # is a failure to reach a verdict at all, and it says nothing about
          # the evidence either way; a head that predates this check, or one
          # where bin/fm-attest.sh is absent or has lost its executable bit,
          # lands there. Both outcomes still fail the check, because a check
          # that could not look must never report a pass. What differs is what
          # the contributor is told to go and repair.
          verify_rc=0
          case "$verifier" in
            reconcile)
              bin/fm-attest.sh reconcile --head "$HEAD_SHA" \
                --remote attestation-source \
                --pr "$PR_NUMBER" --pr-remote pullrequest-source || verify_rc=$?
              ;;
            *) bin/fm-attest.sh verify --head "$HEAD_SHA" || verify_rc=$? ;;
          esac
          if [ "$verify_rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$verify_rc" -ne 1 ]; then
            {
              echo "::error::This check could not evaluate the no-mistakes attestation for its head commit."
              echo
              echo "bin/fm-attest.sh exited ${verify_rc}, which is not a verdict on the evidence."
              echo "It reached no conclusion, so this says nothing about whether this head carries"
              echo "an attestation: it says the check was unable to look. Do not read it as an"
              echo "absent attestation, and do not publish one expecting it to clear this."
              echo
              echo "The lines above name the cause in the verifier's own words. Two families"
              echo "reach here. One is a repository or a ref this job could not read, which is"
              echo "a question that went unanswered rather than an answer, and re-running this"
              echo "run is the repair. The other is the verifier itself: it runs from this pull"
              echo "request's own head, so bin/fm-attest.sh may be missing at this head, have"
              echo "lost its executable bit, or the head may predate the check entirely. Rebase"
              echo "onto the base branch so the head carries the verifier, then re-run this check."
              echo
              echo "The check fails, because a check that could not look must not report a pass."
              echo
              echo "See docs/no-mistakes-attestation.md for the error model these exits belong to."
              echo
              echo "PR author: ${PR_AUTHOR}"
            } >&2
            exit 1
          fi
          {
            echo "::error::This pull request carries no verified no-mistakes attestation for its head commit."
            echo
            echo "Contributions to this repository must be validated by 'git push no-mistakes',"
            echo "which reviews, tests and lints the change before it is pushed. The proof of"
            echo "that is a git note on refs/notes/no-mistakes naming the exact commit it covers:"
            echo
            bin/fm-attest.sh --print-format | sed 's/^/    /'
            echo
            echo "Publish it for the head under review with:"
            echo
            echo "    bin/fm-attest.sh write"
            echo
            echo "It reads the pipeline's own run record and refuses unless that run validated"
            echo "this exact commit, so it cannot be satisfied by editing text. A new commit is"
            echo "a new head and needs its own attestation."
            echo
            echo "Publishing the note does not re-run this check by itself. refs/notes/no-mistakes"
            echo "is not a pull request head, so pushing it fires no pull request event of its own."
            echo "That gap is why 'bin/fm-attest.sh write' re-runs the run that judged this head as"
            echo "its last step: the same event replays against the same head commit, and because"
            echo "the verdict is bound to that commit an unchanged head simply re-derives its"
            echo "result from the evidence now present. Publishing an attestation converges here"
            echo "on its own, and nothing about this pull request needs editing to make it."
            echo
            echo "If that step reported that it could not reach GitHub Actions, nothing has re-read"
            echo "this head yet. It says so in its own words, and the two causes are gh missing or"
            echo "unauthenticated, and no write access to this repository's Actions - which the"
            echo "author of a pull request raised from a fork does not hold on the parent. In that"
            echo "case re-run this workflow run from the Actions tab, or ask someone who holds that"
            echo "access to. Do not publish the attestation again: it names this commit already."
            echo
            echo "See CONTRIBUTING.md for setup and docs/no-mistakes-attestation.md for what"
            echo "this check does and does not establish."
            echo
            echo "PR author: ${PR_AUTHOR}"
          } >&2
          exit 1
